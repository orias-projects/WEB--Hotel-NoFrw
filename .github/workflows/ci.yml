name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files
        run: |
          test -f README.md
          test -f LICENSE
          test -f .github/workflows/ci.yml

      - name: Secret gate
        id: secrets
        run: |
          missing=0
          if [ -f .env.example ] && [ ! -f .env ]; then
            echo "::warning::Missing .env (only .env.example present) — secret-dependent steps will be skipped"
            missing=1
          fi
          if [ -f .env ] && grep -Eiq 'CHANGE_ME|your_|TODO_SECRET|replace_me|xxx' .env; then
            echo "::warning::Placeholder secrets detected in .env — secret-dependent steps will be skipped"
            missing=1
          fi
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven validate
        run: mvn -B -q validate || echo "::warning::mvn validate soft-failed"
      - name: Maven compile
        run: |
          if [ "${{ steps.secrets.outputs.missing }}" = "1" ]; then
            echo "::warning::Skip compile that may need DB secrets"
            mvn -B -DskipTests -q validate || true
            exit 0
          fi
          mvn -B -DskipTests compile || echo "::warning::mvn compile soft-failed"
